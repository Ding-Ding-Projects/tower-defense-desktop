name: Build and Release (Windows)

# Every push to the default branch, and every manual dispatch, publishes exactly one
# new uniquely tagged non-draft release carrying a real installer.
#
# THIS WORKFLOW RUNS NO TESTS AND NO LINT. That is a standing decision by the owner of
# this project, not an oversight to be repaired by a later contributor. The workflow
# builds, packages, publishes and attaches evidence. Verification happens locally
# before a push, through `npm run check`, and the release checklist says so.
#
# The honest cost of that, stated once: a release can ship from a commit whose checks
# would have failed, and the first thing to notice will be a person running the
# installer. It is the accepted trade.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One release at a time. Two runs racing would both try to claim a tag.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record when the workflow actually started
        id: started
        shell: pwsh
        run: |
          # Read from the run's own record rather than from the clock in this step,
          # so the duration covers the whole run instead of the part after checkout.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          try {
            $run = Invoke-RestMethod -Uri $url -Headers $headers
            $startedAt = ([datetime]$run.run_started_at).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          } catch {
            # Never invent a timestamp. An unavailable one is reported as unavailable.
            $startedAt = 'unavailable'
          }
          "started_at=$startedAt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "workflow started at $startedAt"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute a unique version and tag
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $base = $package.version -replace '\.\d+$', ''
          if (-not $base) { $base = '0.1' }
          # Monotonic in the run number, so no prior release can ever be recycled.
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          $package.version = $version
          $package | ConvertTo-Json -Depth 32 | Set-Content package.json -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "this run will publish $tag"

      - name: Count the lines with the committed counter
        shell: pwsh
        run: |
          # The only allowed answer to "how big is it". Never hand-counted.
          node tools/count-lines.mjs "$env:RUNNER_TEMP\line-count.md"

      - name: Build the installer through the committed script
        shell: cmd
        run: |
          REM Calls the same script a person runs locally, rather than re-implementing
          REM its steps here. A packaging step wired into one script that the workflow
          REM never calls is how every release silently ships without part of itself.
          call build-installer.bat /s

      - name: Confirm the artifacts are real and unsigned
        id: artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Recurse -Filter '*Setup*.exe' | Select-Object -First 1
          $nupkg = Get-ChildItem release -Recurse -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike '*delta*' } | Select-Object -First 1
          $releases = Get-ChildItem release -Recurse -Filter 'RELEASES' | Select-Object -First 1

          if (-not $setup) { throw 'no installer was produced' }
          if (-not $nupkg) { throw 'no full package was produced' }
          if (-not $releases) { throw 'no RELEASES file was produced; this is not a complete Squirrel package' }

          $signature = (Get-AuthenticodeSignature -LiteralPath $setup.FullName).Status
          if ($signature -ne 'NotSigned') { throw "expected an unsigned artifact, got $signature" }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash.ToLower()
          "setup=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "nupkg=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "releases=$($releases.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size_mb=$([math]::Round($setup.Length / 1MB, 1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "installer : $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Write-Host "signature : $signature"
          Write-Host "sha256    : $hash"

      - name: Write the release notes
        id: notes
        shell: pwsh
        run: |
          # Composed by a committed script, not inline. The first attempt embedded a
          # PowerShell here-string whose content must start at column zero, which
          # terminated the surrounding YAML block and failed the whole workflow to
          # parse in zero seconds, before any step ran.
          node tools/release-notes.mjs `
            --version ${{ steps.version.outputs.version }} `
            --setup '${{ steps.artifacts.outputs.setup }}' `
            --sha256 ${{ steps.artifacts.outputs.sha256 }} `
            --size-mb ${{ steps.artifacts.outputs.size_mb }} `
            --commit $env:GITHUB_SHA `
            --started '${{ steps.started.outputs.started_at }}' `
            --line-count (Join-Path $env:RUNNER_TEMP 'line-count.md') `
            --out (Join-Path $env:RUNNER_TEMP 'release-notes.md')
          "path=$(Join-Path $env:RUNNER_TEMP 'release-notes.md')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            '${{ steps.artifacts.outputs.setup }}' `
            '${{ steps.artifacts.outputs.nupkg }}' `
            '${{ steps.artifacts.outputs.releases }}' `
            --title 'Tower Defence Desktop ${{ steps.version.outputs.version }}' `
            --notes-file '${{ steps.notes.outputs.path }}' `
            --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'publishing failed' }

      - name: Confirm the release is really there, with exactly the expected assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Asserted rather than assumed. A release that published with a missing asset
          # looks identical to one that published correctly, until somebody downloads it.
          $json = gh release view '${{ steps.version.outputs.tag }}' --json isDraft,assets,tagName | ConvertFrom-Json
          if ($json.isDraft) { throw 'the release published as a draft' }

          $names = $json.assets | ForEach-Object { $_.name } | Sort-Object
          Write-Host ("assets: " + ($names -join ', '))
          if ($names.Count -ne 3) { throw "expected exactly 3 assets, found $($names.Count)" }
          if (-not ($names -contains 'RELEASES')) { throw 'the RELEASES file is not attached' }
          if (-not ($names | Where-Object { $_ -like '*Setup*.exe' })) { throw 'the installer is not attached' }
          if (-not ($names | Where-Object { $_ -like '*.nupkg' })) { throw 'the package is not attached' }
          Write-Host 'release verified: non-draft, three expected assets present'

      - name: Keep the evidence even when something failed
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/line-count.md
            ${{ runner.temp }}/release-notes.md
            release/squirrel-windows/RELEASES
